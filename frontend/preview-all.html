<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTutor — Master Multi-Portal Viewer &amp; Demo Launcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
    }
    .demo-header {
      background: #1e1b4b;
      border-bottom: 1px solid #312e81;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(124, 58, 237, 0.4);
      color: white;
      border-color: #7c3aed;
    }
    .nav-btn.active {
      background: #7c3aed;
      color: white;
      border-color: #7c3aed;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.5);
    }
    .iframe-wrapper {
      flex-grow: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 65px);
      background: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex-grow: 1;
    }
    .split-view {
      display: none;
      width: 100%;
      height: 100%;
    }
    .split-col {
      flex: 1;
      height: 100%;
      border-right: 2px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .split-col:last-child {
      border-right: none;
    }
    .split-header {
      background: #1e293b;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Top Controller Bar -->
  <div class="demo-header">
    <div class="d-flex align-items-center gap-3">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
        <div>
          <span class="fw-bold text-white fs-6">SmartTutor</span>
          <span class="badge bg-purple text-light border border-primary ms-1" style="font-size: 0.7rem;">Presentation Demo Hub</span>
        </div>
      </div>
    </div>

    <!-- Quick Switcher Tabs -->
    <div class="d-flex gap-2">
      <button class="nav-btn active" id="btn-index" onclick="switchSingleView('index.html', 'btn-index')">
        <i class="bi bi-house-door me-1"></i> Home Gateway
      </button>
      <button class="nav-btn" id="btn-student" onclick="switchSingleView('student-dashboard.html', 'btn-student')">
        <i class="bi bi-mortarboard me-1"></i> Student Portal
      </button>
      <button class="nav-btn" id="btn-tutor" onclick="switchSingleView('tutor-dashboard.html', 'btn-tutor')">
        <i class="bi bi-person-badge me-1"></i> Tutor Page
      </button>
      <button class="nav-btn" id="btn-admin" onclick="switchSingleView('admin.html', 'btn-admin')">
        <i class="bi bi-shield-lock me-1"></i> Admin Page
      </button>
      <button class="nav-btn" id="btn-login" onclick="switchSingleView('login.html', 'btn-login')">
        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
      </button>
      <button class="nav-btn" id="btn-signup" onclick="switchSingleView('signup.html', 'btn-signup')">
        <i class="bi bi-person-plus-fill me-1"></i> Sign Up
      </button>
      <button class="nav-btn" id="btn-split" onclick="enableSplitView('btn-split')">
        <i class="bi bi-columns-gap me-1"></i> 3-Way Split Screen
      </button>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light py-1 px-3 small" onclick="openCurrentInNewTab()">
        <i class="bi bi-box-arrow-up-right me-1"></i> Open Fullscreen
      </button>
    </div>
  </div>

  <!-- Single Frame Container -->
  <div class="iframe-wrapper" id="singleContainer">
    <iframe id="mainIframe" src="index.html"></iframe>
  </div>

  <!-- 3-Way Split Screen Container -->
  <div class="split-view" id="splitContainer">
    <!-- Col 1: Student -->
    <div class="split-col">
      <div class="split-header text-primary">
        <span><i class="bi bi-mortarboard me-1"></i> Student Portal</span>
        <a href="student-dashboard.html" target="_blank" class="text-muted"><i class="bi bi-box-arrow-up-right"></i></a>
      </div>
      <iframe src="student-dashboard.html"></iframe>
    </div>

    <!-- Col 2: Tutor -->
    <div class="split-col">
      <div class="split-header text-warning">
        <span><i class="bi bi-person-badge me-1"></i> Tutor Page</span>
        <a href="tutor-dashboard.html" target="_blank" class="text-muted"><i class="bi bi-box-arrow-up-right"></i></a>
      </div>
      <iframe src="tutor-dashboard.html"></iframe>
    </div>

    <!-- Col 3: Admin -->
    <div class="split-col">
      <div class="split-header text-danger">
        <span><i class="bi bi-pie-chart me-1"></i> Admin Page</span>
        <a href="admin-dashboard.html" target="_blank" class="text-muted"><i class="bi bi-box-arrow-up-right"></i></a>
      </div>
      <iframe src="admin-dashboard.html"></iframe>
    </div>
  </div>

  <script>
    let currentUrl = 'index.html';

    function switchSingleView(url, btnId) {
      currentUrl = url;
      document.getElementById('splitContainer').style.display = 'none';
      document.getElementById('singleContainer').style.display = 'flex';
      document.getElementById('mainIframe').src = url;

      updateActiveBtn(btnId);
    }

    function enableSplitView(btnId) {
      document.getElementById('singleContainer').style.display = 'none';
      document.getElementById('splitContainer').style.display = 'flex';
      updateActiveBtn(btnId);
    }

    function updateActiveBtn(activeId) {
      const btns = document.querySelectorAll('.nav-btn');
      btns.forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(activeId);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function openCurrentInNewTab() {
      window.open(currentUrl, '_blank');
    }
  </script>
</body>
</html>
